name: Post Exchange Rates to Twitter

on:
  schedule:
    # Run every day at 8 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  post-rates:
    runs-on: ubuntu-latest
    
    steps:
      - name: Post exchange rates to Twitter
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST https://ethiopiantoday.com/api/twitter/post-rates \
            -H "Authorization: Bearer ${{ secrets.TWITTER_BOT_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          
          echo "HTTP Status: $http_code"
          echo "Response Body: $body"
          
          if [ "$http_code" -eq 200 ]; then
            echo "✅ Twitter post successful!"
            exit 0
          else
            echo "❌ Twitter post failed with status $http_code"
            exit 1
          fi
      
      - name: ✅ Exchange rates posted successfully
        if: success()
        run: echo "Twitter post completed successfully!"
      
      - name: ❌ Failed to post exchange rates
        if: failure()
        run: echo "Failed to post exchange rates to Twitter"
